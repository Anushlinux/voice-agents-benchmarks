[project]
name = "voice-agents-benchmarks"
version = "0.1.0"
description = "Evidence-backed browser and telephone benchmarks for hosted Rumik voice agents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "audioop-lts>=0.2 ; python_full_version >= '3.13'",
    "boto3>=1.36,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai[realtime]>=2,<3",
    "playwright>=1.50,<2",
    "plivo>=4.59,<5",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "websockets>=14,<17",
]

[project.scripts]
voice-bench = "voice_bench.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_bench"]
artifacts = ["src/voice_bench/channels/browser/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
