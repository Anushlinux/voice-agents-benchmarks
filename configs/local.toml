# Development configuration, not a measured benchmark protocol.
name = "rumik-development"
channels = ["browser", "phone"]
artifact_root = "../artifacts"

[target]
agent_ref = ""
deployed_version = ""

[limits]
# Conservative development caps; settle actual batch limits before live work.
max_call_seconds = 300
max_concurrent_calls = 1
max_attempts_per_case = 1
# Zero means no funded live execution. The scaffold never executes live calls.
max_total_call_minutes = 0
max_spend_inr = "0"
