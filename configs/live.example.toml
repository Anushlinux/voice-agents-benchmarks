# Populate explicit settings only after provider access and budgets are agreed.
# This file is deliberately unable to execute a live run.
name = "rumik-qualification"
channels = ["browser", "phone"]
artifact_root = "../artifacts"

[target]
agent_ref = ""
deployed_version = ""
task_variable = "benchmark_user_task"
# For phone calls, set plivo_sip_trunk_id to the existing trunk UUID in Rumik.
# Its terminationUri must equal this existing Plivo outbound SIP endpoint.
plivo_termination_uri = ""

[limits]
max_call_seconds = 300
max_concurrent_calls = 1
max_attempts_per_case = 1
max_total_call_minutes = 0
max_spend_inr = "0"

[counterpart]
model = ""
voice = ""
instructions = "Play the assigned person speaking with Rumik, which acts for a user. Preserve assigned facts and respond to received audio and permitted tool results."
max_output_tokens = 2048
conversation_idle_seconds = 45
[counterpart.turn_detection]
type = "server_vad"
threshold = 0.5
prefix_padding_ms = 300
silence_duration_ms = 500

[judge]
model = ""
transcription_model = ""
rubric_version = ""
max_output_tokens = 2048
cost_ceiling_inr = "0"

[jev]
model = ""
cost_ceiling_inr = "0"
timeout_seconds = 30
max_request_bytes = 100000

[runtime]
public_base_url = ""
caller_number = ""
target_number = ""
region = "ap-south-1"
setup_timeout_seconds = 45
finalize_timeout_seconds = 30
media_timeout_seconds = 15
cost_ceiling_inr_per_attempt = "0"
rate_card_version = ""
artifact_bucket = ""
artifact_endpoint_url = ""

[runtime.cost_components_inr_per_attempt]
counterpart = "0"
target = "0"
carrier = "0"
