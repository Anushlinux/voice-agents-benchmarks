services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:16-alpine
    profiles: ["database"]
    environment:
      POSTGRES_USER: voice_bench
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: voice_bench
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - benchmark-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_bench -d voice_bench"]
      interval: 5s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: .
      target: worker
    profiles: ["worker"]
    init: true
    shm_size: "512mb"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./datasets:/app/datasets:ro
      - ./artifacts:/app/artifacts
    environment:
      DATABASE_URL: postgresql://voice_bench:local_only@postgres:5432/voice_bench
      RUMIK_API_KEY: ${RUMIK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BENCH_TOOLS_SECRET: ${BENCH_TOOLS_SECRET:-}
      PLIVO_AUTH_ID: ${PLIVO_AUTH_ID:-}
      PLIVO_AUTH_TOKEN: ${PLIVO_AUTH_TOKEN:-}
    command: ["status"]

volumes:
  benchmark-db:
