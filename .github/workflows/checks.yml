name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voice_bench
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: voice_bench_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voice_bench -d voice_bench_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://voice_bench:test_only@127.0.0.1:5432/voice_bench_test
      RUN_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts && npm run build
        working-directory: browser
      - run: python -m pip install uv==0.5.18
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: docker build --target worker -t voice-bench-worker .
      - run: docker run --rm voice-bench-worker status
      - run: docker compose -f infra/validation.compose.yaml up --build --abort-on-container-exit --exit-code-from worker
      - if: always()
        run: docker compose -f infra/validation.compose.yaml down --volumes
